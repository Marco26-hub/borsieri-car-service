name: Deploy su Tophost

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-tophost
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: "npm"

      - name: Install dipendenze
        run: npm ci

      - name: Build statico (next export)
        env:
          NEXT_PUBLIC_GOOGLE_APPOINTMENT_URL: ${{ secrets.NEXT_PUBLIC_GOOGLE_APPOINTMENT_URL }}
        run: npm run build

      - name: Deploy FTP su Tophost
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./out/
          protocol: ftps
